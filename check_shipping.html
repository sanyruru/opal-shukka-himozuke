  ① 店番号を手入力する（打つと、その場で店名が表示される）
     （店番号を打つと、その場で店名が表示される。通信は不要）

  アラジン側の改修は一切不要。得意先マスタはこのファイルの中に

<style>
  :root {
    --navy: #1a5276; --navy-light: #4a90c2; --navy-pale: #e6f1fb;
    --green: #2d6a4f; --green-light: #52b788; --green-pale: #d8f3dc;
    --red: #c1121f; --red-pale: #ffe8e8; --orange: #e76f00;
    --bg: #f4f1eb; --surface: #ffffff; --text: #1a1a1a; --muted: #888; --border: #e0dbd0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); min-height: 100vh; padding: 16px; }
  .header { text-align: center; margin-bottom: 16px; }
  .header-brand { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 4px; }
  .header-title { font-size: 18px; font-weight: 700; color: var(--navy); }
  .header-ver { font-size: 10px; color: var(--muted); margin-top: 3px; font-family: monospace; }

  .card { background: var(--surface); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
  .card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 12px; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 13px 12px; font-size: 16px; border-radius: 10px;
    border: 1.5px solid var(--border); -webkit-appearance: none; background: var(--surface);
  }
  .field input:focus { outline: none; border-color: var(--navy-light); }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .lookup-result { margin-top: 10px; border-radius: 10px; padding: 12px 14px; font-size: 14px; }
  .lookup-result.hit { background: var(--green-pale); border: 1.5px solid var(--green-light); color: var(--green); }
  .lookup-result.miss { background: var(--red-pale); border: 1.5px solid var(--red); color: var(--red); }
  .lookup-result .name { font-size: 17px; font-weight: 900; }
  .lookup-result .sub { font-size: 11px; opacity: 0.8; margin-top: 2px; }

  .btn-primary { width: 100%; padding: 16px; background: var(--navy); border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; color: white; cursor: pointer; -webkit-appearance: none; }
  .btn-primary:disabled { background: #c9c4b8; }
  .btn-scan { width: 100%; padding: 16px; background: var(--green); border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; color: white; cursor: pointer; -webkit-appearance: none; }
  .btn-scan.stop { background: var(--muted); }
  .btn-confirm { width: 100%; padding: 18px; background: var(--green); border: none; border-radius: 14px;
    font-size: 17px; font-weight: 700; color: white; cursor: pointer; margin-bottom: 8px; letter-spacing: 0.05em;
    -webkit-appearance: none; }
  .btn-reset { width: 100%; padding: 14px; background: var(--surface); border: 2px solid var(--border);
    border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer;
    margin-bottom: 8px; -webkit-appearance: none; }
  .btn-text { background: none; border: none; color: var(--navy); font-size: 12px; text-decoration: underline;
    cursor: pointer; padding: 6px; }

  #reader { width: 100%; max-width: 380px; margin: 0 auto 12px; border-radius: 10px; overflow: hidden; }
  #reader.hidden { display: none; }
  .scan-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.5; }

  .slip-card { background: var(--navy); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
  .slip-name { font-size: 17px; font-weight: 900; color: white; }
  .slip-sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 4px; line-height: 1.6; }
  .slip-edit { color: rgba(255,255,255,0.8); font-size: 11px; text-decoration: underline; cursor: pointer;
    float: right; }

  .count-card { background: var(--green-pale); border-radius: 14px; padding: 16px; border: 1.5px solid var(--green-light);
    margin-bottom: 16px; text-align: center; }
  .count-label { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 0.1em; margin-bottom: 4px; }
  .count-value { font-size: 40px; font-weight: 900; color: var(--green); font-family: monospace; }
  .count-progress { height: 8px; background: rgba(0,0,0,0.08); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .count-progress-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width 0.3s ease; }
  .count-progress-fill.over { background: var(--red); }

    background: var(--bg); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .collapsed-summary b { color: var(--navy); }

  .qty-field-row { display: flex; align-items: center; gap: 8px; }
  .qty-field-row input { flex: 1; }

  .item-list { display: flex; flex-direction: column; gap: 6px; }
  .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg);
    border-radius: 8px; border: 1.5px solid var(--border); font-size: 13px; }
  .item-row .num { flex: 1; font-family: monospace; font-weight: 700; color: var(--text); }
  .item-row .box { font-size: 10px; color: var(--muted); }
  .item-row .del { color: var(--red); font-size: 18px; font-weight: 900; cursor: pointer; padding: 0 4px; }
  .empty-list { text-align: center; color: var(--muted); font-size: 13px; padding: 16px; }

  .result-card { border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .result-card.ok { background: var(--green); color: white; }
  .result-card.error { background: var(--red); color: white; }
  .result-icon { font-size: 52px; margin-bottom: 10px; display: block; }
  .result-title { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
  .result-msg { font-size: 14px; opacity: 0.9; margin-top: 8px; line-height: 1.6; }

  .manual-add { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .manual-add-row { display: flex; gap: 8px; }
  .manual-add-row input { flex: 1; }
  .manual-add-row button { padding: 0 16px; background: var(--navy); color: white; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 700; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: white; border-radius: 16px; padding: 24px; margin: 16px; text-align: center; max-width: 320px; width: 100%; }
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--orange); margin-bottom: 8px; }
  .modal-msg { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 20px; text-align: left; }
  .modal-btn { width: 100%; padding: 14px; background: var(--orange); border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; color: white; cursor: pointer; }
  .dup-item { font-family: monospace; background: var(--red-pale); color: var(--red); padding: 4px 8px;
    border-radius: 6px; margin: 3px 0; font-size: 13px; }

  #flash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 50; opacity: 0; }
  #flash.ok  { animation: flashGreen 0.45s forwards; }
  #flash.err { animation: flashRed   0.45s forwards; }
  @keyframes flashGreen { 0% { opacity: 1; background: rgba(82, 183, 136, 0.40); } 100% { opacity: 0; } }
  @keyframes flashRed   { 0% { opacity: 1; background: rgba(193, 18, 31, 0.40); } 100% { opacity: 0; } }
</style>

const GAS_URL = 'https://script.google.com/macros/s/AKfycbxP119mDJp19iXMM04i_fDOrkZibs3W5GCqVpqme_VEsRYBOkG2IFeaQ7D2I8rdH24R/exec'; // 例: 'https://script.google.com/macros/s/xxxxx/exec'

function gasGet(params) {
  const qs = Object.keys(params)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k] === undefined || params[k] === null ? '' : params[k]))
    .join('&');
  return fetch(GAS_URL + '?' + qs).then(r => r.json());
}

/* ─────────────────────────────────────────
   状態（localStorageに保存。ページを閉じても続きから再開できる）
───────────────────────────────────────── */
function loadState() {
  return {
    custCode: localStorage.getItem('ship_custCode') || '',
    plannedQty: localStorage.getItem('ship_plannedQty') || '',
    items:    JSON.parse(localStorage.getItem('ship_items') || '[]'),
    stage:    localStorage.getItem('ship_stage')    || 'entry'  // 'entry' | 'scanning'
  };
}
let ST = loadState();
let itemsExpanded = false; // 一覧を全件表示しているか（大量出荷時の折りたたみ用。保存しない）

function saveState() {
  localStorage.setItem('ship_custCode', ST.custCode);
  localStorage.setItem('ship_plannedQty', ST.plannedQty || '');
  localStorage.setItem('ship_items', JSON.stringify(ST.items));
  localStorage.setItem('ship_stage', ST.stage);
}
function clearState() {
  ['ship_custCode','ship_plannedQty','ship_items','ship_stage'].forEach(k => localStorage.removeItem(k));
  ST = { custCode: '', plannedQty: '', items: [], stage: 'entry' };
  itemsExpanded = false;
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function custName(code) {
  return CUSTOMER_MASTER[String(code).trim()] || null;
}

/* ─────────────────────────────────────────
   効果音（Web Audio API）
───────────────────────────────────────── */
let _actx = null;
function getAudioCtx() {
  if (!_actx) { try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  return _actx;
}
async function resumeCtx(ctx) { if (ctx && ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} } }
function beep(ctx, {freq, duration, type = 'sine', gain = 0.3, delay = 0}) {
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq; g.gain.value = gain;
  osc.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + duration);
}
async function playOkSound() {
  const ctx = getAudioCtx(); if (!ctx) return; await resumeCtx(ctx);
  try { beep(ctx, {freq: 880, duration: 0.12, gain: 0.25}); beep(ctx, {freq: 1320, duration: 0.15, gain: 0.25, delay: 0.12}); } catch (e) {}
}
async function playNgSound() {
  const ctx = getAudioCtx(); if (!ctx) return; await resumeCtx(ctx);
  try { beep(ctx, {freq: 160, duration: 0.35, type: 'sawtooth', gain: 0.3}); } catch (e) {}
}
async function playAlreadySound() {
  const ctx = getAudioCtx(); if (!ctx) return; await resumeCtx(ctx);
  try { beep(ctx, {freq: 600, duration: 0.15, type: 'sine', gain: 0.15}); } catch (e) {}
}
async function playCompleteSound() {
  const ctx = getAudioCtx(); if (!ctx) return; await resumeCtx(ctx);
  try {
    beep(ctx, {freq: 523.25, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0});
    beep(ctx, {freq: 659.25, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0.14});
    beep(ctx, {freq: 783.99, duration: 0.14, type: 'triangle', gain: 0.22, delay: 0.28});
    beep(ctx, {freq: 1046.5, duration: 0.45, type: 'triangle', gain: 0.28, delay: 0.42});
  } catch (e) {}
}
function setFeedback(type) {
  localStorage.setItem('ship_fb', type);
  if (type === 'ng') playNgSound();
  else if (type === 'already') playAlreadySound();
  else if (type === 'complete') playCompleteSound();
  else playOkSound();
}
window.addEventListener('load', function () {
  const fb = localStorage.getItem('ship_fb');
  if (!fb) return;
  localStorage.removeItem('ship_fb');
  const el = document.getElementById('flash');
  if (!el) return;
  el.className = '';
  void el.offsetWidth;
  el.className = (fb === 'ok' || fb === 'complete' || fb === 'already') ? 'ok' : 'err';
});

/* ═════════════════════════════════════════════════════════
   画面①：店番号の入力
═════════════════════════════════════════════════════════ */
function renderEntry() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="card-title">店番号を入力</div>
      <div class="field">
        <label>店番号</label>
        <input id="inCustCode" type="text" inputmode="numeric" placeholder="例：90031" value="${esc(ST.custCode)}" maxlength="5" autofocus>
        <div class="hint">出荷伝票の「得意先コード」欄に書かれている番号です</div>
        <div id="lookupBox"></div>
      </div>
      <div class="field">
        <label>予定数（省略可）</label>
        <input id="inPlannedQty" type="text" inputmode="numeric" placeholder="例：300" value="${esc(ST.plannedQty)}" maxlength="5">
        <div class="hint">セールなど大量出荷のときに入力すると、読み忘れ・数え間違いに気づきやすくなります。<br>数本程度の通常出荷では空欄のままで構いません。</div>
      </div>
    </div>
    <button class="btn-primary" id="btnNext" disabled>箱の読み取りへ進む</button>
  `;
  const codeEl = document.getElementById('inCustCode');
  const qtyEl = document.getElementById('inPlannedQty');
  const btn = document.getElementById('btnNext');

  qtyEl.addEventListener('input', () => { ST.plannedQty = qtyEl.value.trim(); });

  function refreshLookup() {
    const code = codeEl.value.trim();
    ST.custCode = code;
    const box = document.getElementById('lookupBox');
    if (!code) { box.innerHTML = ''; btn.disabled = true; return; }
    const name = custName(code);
    if (name) {
      box.innerHTML = `<div class="lookup-result hit"><div class="name">${esc(name)}</div><div class="sub">店番号 ${esc(code)}</div></div>`;
      btn.disabled = false;
    } else {
      box.innerHTML = `<div class="lookup-result miss">この店番号はマスタに見つかりません<div class="sub">番号を確認してください</div></div>`;
      btn.disabled = true;
    }
  }
  codeEl.addEventListener('input', refreshLookup);
  refreshLookup();

  btn.onclick = function () {
    ST.custCode = codeEl.value.trim();
    ST.plannedQty = qtyEl.value.trim();
    ST.stage = 'scanning';
    saveState();
    renderScanning();
  };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ═════════════════════════════════════════════════════════
   画面②：箱QRのスキャン（3個箱・6個箱共通）
═════════════════════════════════════════════════════════ */
function renderScanning() {
  const name = custName(ST.custCode) || '（不明な得意先）';
  const planned = ST.plannedQty ? parseInt(ST.plannedQty, 10) : null;
  const count = ST.items.length;

  let countBlock;
  if (planned && planned > 0) {
    const pct = Math.min(100, Math.round((count / planned) * 100));
    const over = count > planned;
    countBlock = `
      <div class="count-card">
        <div class="count-label">読み取り済み（予定 ${planned} 本）</div>
        <div class="count-value">${count} <span style="font-size:20px;">/ ${planned} 本</span></div>
        <div class="count-progress"><div class="count-progress-fill ${over ? 'over' : ''}" style="width:${pct}%"></div></div>
      </div>`;
  } else {
    countBlock = `
      <div class="count-card">
        <div class="count-label">読み取り済み</div>
        <div class="count-value">${count} 本</div>
      </div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="slip-card">
      <span class="slip-edit" onclick="backToEntry()">内容を修正</span>
      <div class="slip-name">${esc(name)}</div>
      <div class="slip-sub">店番号 ${esc(ST.custCode)}　／　出荷日 ${esc(todayStr())}</div>
    </div>

    <div class="card">
      <div class="card-title">QRスキャナー</div>
      <div id="reader" class="hidden"></div>
      <button id="scanToggleBtn" class="btn-scan" onclick="toggleScanning()">📷 スキャン開始</button>
      <div class="scan-hint">箱の封緘シールQRを、必要な数だけ読んでください（3個箱・6個箱どちらもそのまま読めます）<br>伝票を見ながら、出す本と出さない本を確認してください</div>
    </div>

    ${countBlock}

    <div class="card">
      <div class="card-title">読み取ったロット番号</div>
      <div class="item-list">${renderItemList()}</div>
      <div class="manual-add">
        <div class="hint" style="margin-bottom:6px;">QRが読めないときは、シール上半分の番号を直接入力できます</div>
        <div class="manual-add-row">
          <input id="manualNum" type="text" inputmode="numeric" placeholder="例：000925" maxlength="6">
          <button onclick="addManual()">追加</button>
        </div>
      </div>
    </div>

    <button class="btn-confirm" onclick="confirmShipment()" ${ST.items.length === 0 ? 'disabled style="opacity:0.5;"' : ''}>出荷確定</button>
    <button class="btn-reset" onclick="resetAll()">🔄 最初からやり直す</button>
  `;
}

/* 一覧が長くなりすぎると読みにくいので、直近8件だけ広げて表示し、
   それより前はまとめて折りたたむ（大量出荷対策）。全件表示に切り替え可能。 */
const COLLAPSE_THRESHOLD = 12;
const RECENT_COUNT = 8;

function toggleItemsExpanded() {
  itemsExpanded = !itemsExpanded;
  renderScanning();
}

function renderItemList() {
  if (ST.items.length === 0) return `<div class="empty-list">まだ読み取っていません</div>`;

  if (ST.items.length <= COLLAPSE_THRESHOLD || itemsExpanded) {
    const summary = ST.items.length > COLLAPSE_THRESHOLD
      ? `<div class="collapsed-summary" onclick="toggleItemsExpanded()">たたんで表示する ▲</div>`
      : '';
    return summary + ST.items.map((it, i) => renderItemRow(it, i)).join('');
  }

  const hiddenCount = ST.items.length - RECENT_COUNT;
  const recent = ST.items.slice(-RECENT_COUNT);
  const offset = ST.items.length - RECENT_COUNT;
  return `
    <div class="collapsed-summary" onclick="toggleItemsExpanded()">
      他 <b>${hiddenCount}本</b>（折りたたみ中）タップして全件表示 ▼
    </div>
    ${recent.map((it, i) => renderItemRow(it, offset + i)).join('')}
  `;
}

function renderItemRow(it, i) {
  return `
    <div class="item-row">
      <div class="num">${esc(it.num)}</div>
      <div class="box">同じ箱：${esc(it.box.join('/'))}</div>
      <div class="del" onclick="removeItem(${i})">×</div>
    </div>`;
}

function backToEntry() {
  ST.stage = 'entry';
  saveState();
  renderEntry();
}

function removeItem(i) {
  ST.items.splice(i, 1);
  saveState();
  renderScanning();
}

function addManual() {
  const el = document.getElementById('manualNum');
  const num = el.value.trim();
  if (!num) return;
  addProductNumber(num, [num]);
  renderScanning();
}

/* 箱QR（BOX:000925,000926,000927）または単体番号を受け取り、重複を避けて追加する */
function addProductNumber(num, boxGroup) {
  if (ST.items.some(it => it.num === num)) {
    setFeedback('already');
    return false;
  }
  ST.items.push({ num: num, box: boxGroup });
  saveState();
  setFeedback('ok');
  return true;
}

function parseBoxCode(raw) {
  const m = String(raw).trim().match(/^BOX:(.+)$/i);
  if (!m) return null;
  const nums = m[1].split(',').map(s => s.trim()).filter(Boolean);
  if (nums.length === 0) return null;
  return nums;
}

/* ═════════════════════════════════════════════════════════
   カメラスキャン（原料照合システムと同じ仕組みを流用）
═════════════════════════════════════════════════════════ */
let html5QrCode = null;
let scanning = false;
let lastScanCode = null;
let pendingConfirmCode = null;
let pendingConfirmCount = 0;
const CONFIRM_THRESHOLD = 2;

let lastFrameTime = Date.now();
let isAutoRestarting = false;
let missFrames = 0;
const ALLOWED_MISS_FRAMES = 3;
const QRBOX_SIZE = 250;
const SCAN_FPS = 15;

function calcQrbox(viewfinderWidth, viewfinderHeight) {
  const shorter = Math.min(viewfinderWidth || 0, viewfinderHeight || 0);
  let size = Math.floor(shorter * 0.8);
  if (!size || size < 0) size = 150;
  size = Math.min(size, QRBOX_SIZE);
  size = Math.max(size, 120);
  return { width: size, height: size };
}

function extractCodeFromScan(decodedText) {
  try {
    const url = new URL(decodedText);
    const d = url.searchParams.get('d');
    if (d) return d.trim();
  } catch (e) {}
  return decodedText.trim();
}

function handleScannedCode(raw) {
  const boxNums = parseBoxCode(raw);
  if (!boxNums) {
    setFeedback('ng');
    showModal('登録されていないQRコードです', 'この箱の封緘シールQRではありません。<br>汚れている場合は下の欄に番号を手入力してください。');
    return;
  }
  let addedAny = false;
  let allDup = true;
  boxNums.forEach(n => {
    const ok = addProductNumber(n, boxNums);
    if (ok) { addedAny = true; allDup = false; }
  });
  if (!addedAny && !allDup) { /* no-op */ }
  if (!addedAny) {
    setFeedback('already');
  } else {
    setFeedback('ok');
  }
  renderScanning();
}

function onScanSuccess(decodedText) {
  lastFrameTime = Date.now();
  missFrames = 0;
  const code = extractCodeFromScan(decodedText);
  if (code === lastScanCode) { pendingConfirmCode = null; pendingConfirmCount = 0; return; }
  if (code === pendingConfirmCode) { pendingConfirmCount++; } else { pendingConfirmCode = code; pendingConfirmCount = 1; }
  if (pendingConfirmCount >= CONFIRM_THRESHOLD) {
    lastScanCode = code; pendingConfirmCode = null; pendingConfirmCount = 0;
    handleScannedCode(code);
  }
}
function onScanFailure() {
  lastFrameTime = Date.now();
  missFrames++;
  if (missFrames >= ALLOWED_MISS_FRAMES) { pendingConfirmCode = null; pendingConfirmCount = 0; missFrames = 0; }
}

async function toggleScanning() {
  if (isAutoRestarting) return;
  const ctx = getAudioCtx();
  await resumeCtx(ctx);
  if (scanning) { await stopScanning(); return; }

  const readerEl = document.getElementById('reader');
  const btn = document.getElementById('scanToggleBtn');
  readerEl.classList.remove('hidden');

  html5QrCode = new Html5Qrcode("reader");
  try {
    try {
      await html5QrCode.start({ facingMode: "environment" }, { fps: SCAN_FPS, qrbox: calcQrbox }, onScanSuccess, onScanFailure);
    } catch (e1) {
      html5QrCode = new Html5Qrcode("reader");
      await html5QrCode.start({ facingMode: "environment" }, { fps: SCAN_FPS }, onScanSuccess, onScanFailure);
    }
    scanning = true; lastFrameTime = Date.now(); missFrames = 0;
    btn.textContent = '⏹ スキャン停止';
    btn.classList.add('stop');
    await resumeCtx(getAudioCtx());
  } catch (err) {
    alert('カメラを起動できませんでした。\nHTTPSのURLで開いているか、カメラの使用を許可しているか確認してください。\n\nエラー: ' + err);
    readerEl.classList.add('hidden');
  }
}

async function stopScanning() {
  if (html5QrCode) { try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {} }
  scanning = false; lastScanCode = null; pendingConfirmCode = null; pendingConfirmCount = 0;
  const readerEl = document.getElementById('reader');
  if (readerEl) readerEl.classList.add('hidden');
  const btn = document.getElementById('scanToggleBtn');
  if (btn) { btn.textContent = '📷 スキャン開始'; btn.classList.remove('stop'); }
}

let wasScanningBeforeHide = false;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) {
    wasScanningBeforeHide = scanning;
  } else if (wasScanningBeforeHide) {
    wasScanningBeforeHide = false;
    try { isAutoRestarting = true; await stopScanning(); await toggleScanning(); }
    catch (e) {} finally { isAutoRestarting = false; }
  }
});

setInterval(async () => {
  if (!scanning || isAutoRestarting || document.hidden) return;
  if (Date.now() - lastFrameTime > 8000) {
    isAutoRestarting = true;
    try { await stopScanning(); await toggleScanning(); } catch (e) {} finally { isAutoRestarting = false; }
  }
}, 3000);

/* ═════════════════════════════════════════════════════════
   出荷確定（このタイミングだけGASへ通信する）
═════════════════════════════════════════════════════════ */
async function confirmShipment() {
  if (ST.items.length === 0) return;
  if (!GAS_URL) {
    showModal('GAS_URLが未設定です', 'コード上部の GAS_URL に、デプロイしたウェブアプリのURLを設定してください。');
    return;
  }

  const planned = ST.plannedQty ? parseInt(ST.plannedQty, 10) : null;
  if (planned && planned > 0 && planned !== ST.items.length) {
    renderQtyMismatch(planned, ST.items.length);
    return;
  }

  await doConfirmSend(null);
}

/* 予定数と実際に読んだ本数が違うときの確認画面。
   理由を選んでもらってから送信する（欠品・後送あり・その他）。
   予定数を入力していない通常出荷では、このチェックは一切表示されない。 */
function renderQtyMismatch(planned, actual) {
  const diff = actual - planned;
  const diffText = diff > 0 ? `予定より ${diff} 本多い` : `予定より ${Math.abs(diff)} 本少ない`;
  document.getElementById('app').innerHTML = `
    <div class="result-card error">
      <span class="result-icon">⚠️</span>
      <div class="result-title">予定数と本数が違います</div>
      <div class="result-msg">予定 ${planned} 本 ／ 実際 ${actual} 本（${esc(diffText)}）<br>読み忘れ・重複読みがないか、もう一度確認してください。</div>
    </div>
    <div class="card">
      <div class="card-title">意図的な差なら、理由を選んで確定できます</div>
      <button class="btn-primary" style="margin-bottom:8px;" onclick="doConfirmSend('欠品')">欠品（在庫がなく、この本数で出す）</button>
      <button class="btn-primary" style="margin-bottom:8px;" onclick="doConfirmSend('後送あり')">後送あり（残りは別の日に出す）</button>
      <button class="btn-primary" style="margin-bottom:8px;" onclick="doConfirmSend('その他')">その他の理由で確定する</button>
    </div>
    <button class="btn-reset" onclick="renderScanning()">一覧に戻って確認する</button>
  `;
}

async function doConfirmSend(mismatchReason) {
  await stopScanning();
  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align:center;padding:40px 16px;">
      <div style="font-size:40px;margin-bottom:12px;">📡</div>
      <div style="font-weight:700;">送信中...</div>
    </div>
  `;

  const name = custName(ST.custCode) || '';
  const planned = ST.plannedQty ? parseInt(ST.plannedQty, 10) : null;
  const payload = {
    action: 'ship_confirm',
    custCode: ST.custCode,
    custName: name,
    shipDate: todayStr(),
    products: ST.items.map(it => it.num).join(',')
  };
  if (planned && planned > 0) payload.plannedQty = planned;
  if (mismatchReason) payload.mismatchReason = mismatchReason;

  let res;
  try {
    res = await gasGet(payload);
  } catch (e) {
    setFeedback('ng');
    showModal('サーバーに接続できません', '電波の良い場所でもう一度お試しください。<br>読み取った内容は消えていません。');
    renderScanning();
    return;
  }

  if (!res.success) {
    if (res.error === 'duplicate') {
      setFeedback('ng');
      renderDuplicateError(res.duplicates || []);
      return;
    }
    setFeedback('ng');
    showModal('送信できませんでした', esc(res.error || 'もう一度お試しください'));
    renderScanning();
    return;
  }

  setFeedback('complete');
  renderComplete(res);
}

function renderDuplicateError(dups) {
  const name = custName(ST.custCode) || '';
  document.getElementById('app').innerHTML = `
    <div class="result-card error">
      <span class="result-icon">⚠️</span>
      <div class="result-title">二重出荷の可能性</div>
      <div class="result-msg">次のロット番号は、すでに出荷済みとして記録されています。<br>現品を確認し、該当の番号を一覧から削除してから、もう一度確定してください。</div>
    </div>
    <div class="card">
      <div class="card-title">出荷済みだった番号</div>
      ${dups.map(d => `<div class="dup-item">${esc(d)}</div>`).join('')}
    </div>
    <button class="btn-primary" onclick="removeDuplicatesAndReturn(${JSON.stringify(dups).replace(/"/g,'&quot;')})">この番号を一覧から外す</button>
    <button class="btn-reset" onclick="renderScanning()">一覧に戻る</button>
  `;
}

function removeDuplicatesAndReturn(dups) {
  ST.items = ST.items.filter(it => !dups.includes(it.num));
  saveState();
  renderScanning();
}

function renderComplete(res) {
  const name = custName(ST.custCode) || '';
  document.getElementById('app').innerHTML = `
    <div class="result-card ok">
      <span class="result-icon">🎉</span>
      <div class="result-title">出荷確定しました</div>
      <div class="result-msg">${esc(name)}　${esc(todayStr())}<br>${ST.items.length}本を記録しました</div>
    </div>
    <button class="btn-primary" onclick="resetAll()">次の得意先へ</button>
  `;
  clearState();
}

/* ─── 注意モーダル ───────────────────────────────── */
function showModal(title, msg) {
  document.getElementById('modal').innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">${esc(title)}</div>
        <div class="modal-msg">${msg}</div>
        <button class="modal-btn" onclick="closeModal()">閉じる</button>
      </div>
    </div>
  `;
}
function closeModal() { document.getElementById('modal').innerHTML = ''; }

function resetAll() {
  clearState();
  renderEntry();
}

/* ═════════════════════════════════════════════════════════
   起動
═════════════════════════════════════════════════════════ */
const APP_VERSION = 'v1.0 (2026-09-04)';
(function () {
  const el = document.getElementById('appVer');
  if (el) el.textContent = APP_VERSION;
})();

async function checkForUpdate() {
  try {
    const base = location.href.split('?')[0].split('#')[0];
    const res = await fetch(base + '?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    if (!m) return;
    const latest = m[1];
    if (latest === APP_VERSION) { sessionStorage.removeItem('shipUpdTried'); return; }
    if (sessionStorage.getItem('shipUpdTried') === latest) return;
    sessionStorage.setItem('shipUpdTried', latest);
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center;padding:30px 16px;">
        <div style="font-size:40px;margin-bottom:12px;">⬇️</div>
        <div style="font-weight:700;">新しい版に更新しています</div>
        <div style="font-size:12px;color:#888;margin-top:8px;">${APP_VERSION} → ${latest}</div>
      </div>
    `;
    location.replace(base + '?v=' + encodeURIComponent(latest));
  } catch (e) {}
}

if (ST.stage === 'scanning' && ST.custCode && custName(ST.custCode)) {
  renderScanning();
} else {
  renderEntry();
}
checkForUpdate();
</script>
</body>
